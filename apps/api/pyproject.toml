[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "novelai-workspace-api"
version = "0.1.0"
description = "Backend for the NovelAI image workspace"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "openai-codex-sdk==0.1.11",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
]
lint = [
    "ruff>=0.11,<1",
]

[project.scripts]
novelai-admin = "novelai_api.admin:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
novelai_api = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
